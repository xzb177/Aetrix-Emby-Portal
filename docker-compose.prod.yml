# Aetrix Portal —— 生产部署（拉取私有镜像，无需源码）
#
# 这个文件与仓库里的 docker-compose.yml 是**两套并存**的东西：
#   docker-compose.yml       开发/自建：从源码 build 镜像（docker compose build）
#   docker-compose.prod.yml  本文件：授权客户部署，只 pull 官方镜像，没有 build 段
#
# 发行包里的这个文件会被重命名为 docker-compose.yml，客户那边就一条命令：
#   docker compose up -d
#
# 版本升级：改 .env 里的 AETRIX_IMAGE_TAG 再 `docker compose pull && up -d`。
# 两个镜像用同一个 tag（来自 VERSION），不要只升一个 —— 前后端版本必须配套。

name: aetrix-portal

services:
  # 后端 API：FastAPI + worker + 自建 Emby 服务端（run_all.py 三进程）
  aetrix-api:
    # 没有 build: —— 客户机器上没有源码，也不该有。镜像来自 GitHub Container Registry。
    # AETRIX_IMAGE_TAG 默认 latest；要固定版本就在 .env 里写死（如 2.42.9），便于回滚。
    image: ghcr.io/xzb177/aetrix-api:${AETRIX_IMAGE_TAG:-latest}
    container_name: aetrix-api
    restart: unless-stopped
    command: ["python", "backend/run_all.py"]
    env_file:
      - .env
    environment:
      AETRIX_ROLE: all  # 合并：api+worker+ea
      # EA 网关配置（原 ea 服务的环境变量，合并后保留）
      EMBY_API_PORT: 8001
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_TYPE: ${DATABASE_TYPE:-postgresql}
      # WS1: db_pool_size 改由管理面板接管（system_configs），此处不再设 env
      DATABASE_URL: ${DATABASE_URL:-postgresql://aetrix:${POSTGRES_PASSWORD:-aetrix_dev_only_change_me}@postgres:5432/aetrix}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-25}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMBY_TRANSCODE_DIR: /data/transcode
      EMBY_IMAGE_DIR: /data/images
      # 前后端分离：静态文件由 aetrix-web（nginx）提供，后端指向不存在的路径让它跳过挂载
      FRONTEND_DIST: /nonexistent-frontend
      ADMIN_DIST: /nonexistent-admin
      # 存储挂载 · rclone RC：指向同网络的 rclone 容器，容器名即服务名
      MOUNT_RCLONE_RC_URL: ${MOUNT_RCLONE_RC_URL:-http://rclone:5572}
      MOUNT_RCLONE_BIN: ${MOUNT_RCLONE_BIN:-rclone}
      # rclone：配置由**用户自己**粘贴（后台「rclone.conf」页），面板只负责落盘并
      # 给 rclone 命令加 --config。这个目录必须与 rclone 容器挂的是**同一份宿主目录**，
      # 否则写进去的 rclone.conf rclone 容器看不到（面板显示成功、实际用不了）。
      MOUNT_RCLONE_CONF: /config/rclone/rclone.conf
      RCLONE_SA_DIR: /sa-accounts
    # 不直接暴露公网端口：统一走 aetrix-web（nginx）反代
    expose:
      - "8000"
    volumes:
      - aetrix_data:/data
      - ${MEDIA_ROOT:-./media}:/media:ro
      # rw：后台粘贴的 rclone.conf 写在这里（.conf 里含 token/secret，故权限收紧为 600）
      - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone
      # rw：面板要写服务账号 JSON（同样 chmod 600）
      - ${RCLONE_SA_DIR:-/root/sa-accounts}:/sa-accounts
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # 合并容器健康检查：API(8000) + EA(8001) + worker 心跳（Redis）三者都正常才算健康
      test: ["CMD", "python", "-c", "import urllib.request,redis,os,json,time; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4); urllib.request.urlopen('http://127.0.0.1:8001/api/health',timeout=4); r=redis.from_url(os.getenv('REDIS_URL','redis://redis:6379/0'),decode_responses=True); h=r.get('aetrix:worker:heartbeat'); assert h and (time.time()-json.loads(h)['updated_at'])<90"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  # 前端：nginx serve 双前端静态文件，/api/* 与 /emby/* 反代到 aetrix-api
  aetrix-web:
    image: ghcr.io/xzb177/aetrix-web:${AETRIX_IMAGE_TAG:-latest}
    container_name: aetrix-web
    restart: unless-stopped
    ports:
      - "${AETRIX_PORT:-8000}:80"
    depends_on:
      aetrix-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: aetrix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PostgreSQL：主数据库（v2.42.0 起为默认）
  # 密码走环境变量 POSTGRES_PASSWORD，不写死。
  # ⚠️ 这里的兜底默认值是**弱口令**（沿用开发版），它存在的唯一目的是让本机试跑
  # 不会因为漏配而报错。授权客户的部署请务必先在 .env 里改成随机强密码
  # （DEPLOY.md 第 3 步的命令会自动生成）。公网上的部署用这个默认口令等于没设密码。
  postgres:
    image: postgres:16-alpine
    container_name: aetrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aetrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetrix_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-aetrix}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aetrix} -d $${POSTGRES_DB:-aetrix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # rclone RC：把 remote 定义接进 Aetrix「存储挂载」，凭据只放在挂载卷里
  # 默认不启动（按需启用）：只有挂载类型选了 rclone 时才需要它。
  #   默认：docker compose up -d                     → 4 容器（api + web + postgres + redis）
  #   启用：docker compose --profile rclone up -d     → 6 容器（+ rclone + rclone-serve）
  #
  # ⚠️ 启用 rclone profile 前**必须**先在 .env 里填 RCLONE_RC_USER 与 RCLONE_RC_PASS。
  # 这里用 `:-` 而不是开发版的 `:?`（缺变量就报错），是因为 compose 会在**解析**阶段
  # 展开所有 service 的变量——哪怕 profile 没启用。开发版那样写，客户 `cp env.example .env`
  # 之后直接 `docker compose up -d` 会在变量插值阶段就失败（env.example 里本来也没有这两个
  # 键），镜像都拉不下来。授权客户的默认路径是 4 容器，不能被一个用不到的 profile 卡住。
  # 真要启用 rclone 时，空凭据会让 rcd 起不来（那正是预期的失败），按 DEPLOY.md 填好即可。
  rclone:
    profiles: ["rclone"]
    image: rclone/rclone:1.71.1
    container_name: aetrix-rclone
    restart: unless-stopped
    command:
      - rcd
      - --rc-serve
      - --rc-addr=0.0.0.0:5572
      - --rc-user=${RCLONE_RC_USER:-}
      - --rc-pass=${RCLONE_RC_PASS:-}
    environment:
      # Go 堆内存上限（安全阀，不是调优）：实测 rcd 在持续 RC 调用下堆会涨到 2.6GB，
      # GOMEMLIMIT 降不下来这部分，只能防止它继续涨爆整机内存。
      # 真正的根治是 Drive 走 SA 池直调 API，彻底不用 rcd。
      - GOMEMLIMIT=${RCLONE_RCD_GOMEMLIMIT:-4GiB}
    # 配置目录要可写：rclone 刷新 OAuth token / 写回 remote 状态时需要落盘，
    # 只读挂载会出现 "Failed to save config ... read-only file system"，
    # 表面能读，实际 token 一过期就再也续不回来。
    volumes:
      - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone
      # 服务账号（Google Drive 团队盘常用）：remote 里写
      # ``service_account_file = /sa-accounts/<name>.json``，这里把宿主机目录挂进去。
      # 未配置时用同一个默认目录；目录不存在也不影响启动（rclone 不会主动去读）。
      - ${RCLONE_SA_DIR:-/root/sa-accounts}:/sa-accounts:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5572 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # rclone 取流服务（数据面）：与上面的 rcd（控制面）配套，**必须**开 VFS 缓存。
  rclone-serve:
    profiles: ["rclone"]
    image: rclone/rclone:1.71.1
    container_name: aetrix-rclone-serve
    restart: unless-stopped
    # remote 名硬编码为 MP：面板里那个 rclone 挂载用的就是它。
    command:
      - serve
      - http
      - ${RCLONE_SERVE_REMOTE:-MP:}
      - --addr=0.0.0.0:8080
    # 与 rcd 用同一套 RC 凭据；Aetrix 取流时带同样的 Basic 认证（同上，启用前先填 .env）
      - --user=${RCLONE_RC_USER:-}
      - --pass=${RCLONE_RC_PASS:-}
    # ---- 关键：VFS 缓存 ----
      # full：读写都缓存。Drive 每次 Range 读有约 1.2 秒固定往返，而播放器的探测与
      # 续读全是小 Range，每次都吃这段延迟。开缓存后读过的区间落本地，
      # 重复读从 1.2s 降到毫秒级（实测 2ms）。
      - --vfs-cache-mode=full
      # 限额必须给死：单部 4K 电影就 17GB。min-free-space 是兜底：剩余低于它就
      # 停止继续写入缓存（宁可不缓存也不能撑爆盘）。
      - --vfs-cache-max-size=${RCLONE_VFS_CACHE_MAX_SIZE:-2G}
      - --vfs-cache-min-free-space=${RCLONE_VFS_CACHE_MIN_FREE:-5G}
      # 预读块：单文件内存预读上限 128M。并发回退流一多，256M/文件很容易吃光内存。
      - --vfs-read-chunk-size=32M
      - --vfs-read-chunk-size-limit=${RCLONE_VFS_READ_CHUNK_LIMIT:-128M}
      # 缓存目录：rclone **没有** --vfs-cache-dir 这个 flag（实测
      # ``rcd --help | grep -c vfs-cache-dir`` → 0），写成它容器直接起不来。
      - --cache-dir=/config/rclone
      - --dir-cache-time=24h
      - --no-modtime
      - --no-check-certificate
    volumes:
      # 与 rcd 同一份 rclone.conf（服务账号路径、team_drive 都在里面）
      - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone
      - ${RCLONE_SA_DIR:-/root/sa-accounts}:/sa-accounts:ro
    # 探 TCP 端口，不要探 HTTP 路径：serve http 配了 --user/--pass，
    # 无凭据请求一律 401（那是**期望行为**，不是故障），拿它当健康标准会永远
    # unhealthy。也刻意不去 poll Drive 列目录——每 30 秒一次纯属烧配额。
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      rclone:
        condition: service_started

volumes:
  aetrix_data:
  redis_data:
  postgres_data: