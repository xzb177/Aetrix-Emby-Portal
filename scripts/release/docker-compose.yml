# Aetrix 发行版 · 买家部署（由 scripts/build_release.sh 放入发行包根目录）
#
# 拉取形态：程序本体不在发行包里，两个服务都从镜像仓库拉成品镜像
# （ghcr.io/xzb177/aetrix-api、ghcr.io/xzb177/aetrix-web，由
# .github/workflows/publish-images.yml 在主线 CI 全绿后自动发布，
# tag 规则：版本号 / sha-<短码> / latest）。买家机器上不做任何构建。
#
# 启动前两件事（见《安装说明.md》）：
#   1. 用随授权码发放的拉取凭据 docker login ghcr.io（不登录拉不到镜像）；
#   2. 同目录下有一份 .env（从 env.example 复制后改 SECRET_KEY、
#      POSTGRES_PASSWORD、授权码与绑定域名四处）。
# 启动：docker compose pull && docker compose up -d
# 升/降版：改 .env 里的 AETRIX_VERSION 为目标版本号，再 pull + up -d。
name: aetrix

services:
  postgres:
    image: postgres:16-alpine
    container_name: aetrix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aetrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetrix_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-aetrix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aetrix} -d $${POSTGRES_DB:-aetrix}"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aetrix-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  aetrix-api:
    image: ghcr.io/xzb177/aetrix-api:${AETRIX_VERSION:-2.54.0}
    container_name: aetrix-api
    # 镜像默认入口是 python serve.py，只起门户 API 一个进程；
    # 发行版要的是单容器全家桶（门户 API + Emby 服务 + 后台任务），
    # 所以这里覆盖成 run_all —— 它就在镜像里（/app/backend/run_all.py），
    # 以 /app 为工作目录拉起三个子进程，与自建版的发行形态一致。
    command: ["python", "backend/run_all.py"]
    env_file:
      - .env
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://aetrix:${POSTGRES_PASSWORD:-aetrix_dev_only_change_me}@postgres:5432/aetrix
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      # 软件授权校验：发行版默认开（关掉填 0，但未授权状态下不能播放）
      AETRIX_LICENSE_ENFORCE: ${AETRIX_LICENSE_ENFORCE:-1}
      EMBY_IMAGE_DIR: /data/images
      EMBY_TRANSCODE_DIR: /data/transcode
    volumes:
      - aetrix_data:/data
      - ${MEDIA_ROOT:-./media}:/media:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  aetrix-web:
    image: ghcr.io/xzb177/aetrix-web:${AETRIX_VERSION:-2.54.0}
    container_name: aetrix-web
    # 镜像内 nginx 的后端地址由 BACKEND_HOST 决定（未设置时默认
    # aetrix-api:8000，这里显式写死，免得将来默认值变动影响发行版）
    environment:
      BACKEND_HOST: aetrix-api:8000
    ports:
      - "${AETRIX_PORT:-8000}:80"
    depends_on:
      - aetrix-api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  aetrix_data:
