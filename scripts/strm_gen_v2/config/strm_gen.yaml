# gen_strm_v2 配置文件
# 所有业务阈值、策略、模板集中在此，代码中禁止硬编码业务常量 (D-CONF-1)

# ── 源与目标 ──
source:
  # Drive 媒体库根目录 ID（MoviePilot 目录）
  drive_root_id: ""
  # SA 凭证目录（100 个 SA 的 JSON key 文件）
  sa_credentials_dir: "/opt/rclone-sa"
  # 只处理这些 MIME 前缀的视频文件
  include_mime: ["video/"]
  # 排除路径正则（系统/临时目录）
  exclude_pattern:
    - '(?i)/\.(tmp|temp)/'
    - '(?i)\.part$'
    - '(?i)/@eaDir/'
    - '(?i)/#recycle/'
    - '(?i)/#snapshot/'

target:
  # .strm 输出根目录
  strm_root: "/opt/strm"
  # URL 生成模板，可用变量：{file_id}, {name}, {size}, {md5}
  # 默认兼容 v1 的直链格式
  url_template: "https://drive.google.com/uc?export=download&id={file_id}&confirm=t"
  # Drive 路径前缀映射：去掉此前缀以匹配现有 /strm/ 目录结构
  strip_prefix: "MoviePilot/"
  # 删除策略：retain(保留) | trash(移入回收站) | delete(直接删除) (D-FLOW-2)
  delete_policy: "trash"
  trash_dir: "/opt/strm/.trash"

# ── 增量 ──
incremental:
  # full(全量) | incremental(增量，Changes API)
  mode: "incremental"
  state_db: "/opt/strm/.state/state.db"
  # v1 状态库路径（首次运行时自动迁移）
  v1_state_db: "/opt/strm/.gen_strm_state.db"
  # 全量对账周期（天），防止增量漂移 (D-INCR-4)
  full_reconcile_days: 30
  # 每 N 个文件提交一次 checkpoint (D-INCR-5)
  checkpoint_every: 500

# ── 脏数据 ──
dirty_data:
  # strict(原样镜像+告警) | normalize(按规则自动归一化) (D-DIRTY-2)
  mirror_mode: "strict"
  rules_file: "config/dirty_rules.yaml"

# ── 校验 ── (D-VERIFY-1/2)
verify:
  # full(全量) | sample(抽样) | off(关闭)
  mode: "sample"
  # 抽样率
  sample_rate: 0.05
  # 每分片最少抽样数（小库不被抽样率饿死）
  sample_min_per_shard: 20
  # 本次新生成的 .strm 强制全检
  newly_generated: "always"
  timeout_seconds: 15
  max_retries: 2
  # 连续 N 次校验失败才告警升级
  fail_threshold: 3

# ── 并发与限流 ── (D-CONC-1/2)
concurrency:
  collector_workers: 4
  executor_workers: 16
  verifier_workers: 8
  queue_size: 1000

rate_limit:
  # Drive API 全局 QPS 上限（所有 SA 合计）
  drive_api_qps: 8.0
  # 校验 URL QPS 上限（独立，更低）
  verify_qps: 4.0
  # 请求间隔抖动比例 ±30% (D-CONC-2)
  jitter_ratio: 0.3
  # 429/403 时退避策略：exponential
  backoff: "exponential"
  backoff_base_seconds: 1.0
  backoff_max_seconds: 300.0

# SA 熔断 (D-CONC-4)
circuit_breaker:
  # 配额错误后冷却时长（秒）
  cooldown_seconds: 600
  # 触发熔断的连续错误数
  error_threshold: 3

# ── 报告 ──
report:
  dir: "/opt/strm/.reports"
  keep_days: 30
  dirty_report: true
  verify_report: true
  run_report: true

# ── 运行 ──
run:
  dry_run: false
  # 空 = 全部分片；指定库名则只跑这些
  shards: []
  log_level: "INFO"
  # 日志文件（空则只输出到 stdout）
  log_file: ""
