# 脏数据规则配置 (D-DIRTY-1: 声明式 YAML，新增类型无需改代码)
# action: report(只告警) | normalize(自动归一化) | ignore(忽略)
# 默认全部 report，归一化需显式 opt-in (D-DIRTY-2)

rules:
  - id: EMPTY_SEASON_DIR
    enabled: true
    description: "空的 Season 目录（如《故乡的泥土》/Season 1/ 为空）"
    match:
      type: dir
      name_pattern: '(?i)^season\s*\d+$'
      empty: true
    action: report

  - id: EPISODE_OUTSIDE_SEASON
    enabled: true
    description: "剧集文件不在 Season 目录下（如 S01E01 直接在剧目录）"
    match:
      type: file
      name_pattern: '(?i)s\d{1,2}e\d{1,2}'
      parent_pattern: '(?i)season'
      negate_parent: true
    action: report
    # 归一化建议目标路径模板（仅当 action 含 normalize 时使用）
    normalize_target: "{parent}/Season {season_num}/{name}"

  - id: ORPHAN_STRM
    enabled: true
    description: "本地有 .strm 但 Drive 已无对应 file_id（残留）"
    match:
      type: orphan
    action: report

  - id: MIXED_MOVIE_EPISODE
    enabled: false
    description: "电影库出现剧集命名文件（待规则细化，默认关闭）"
    match:
      type: file
      name_pattern: '(?i)s\d{1,2}e\d{1,2}'
      parent_pattern: '(?i)/电影|/movie'
    action: report

  - id: NAME_MISMATCH
    enabled: false
    description: "目录名与文件名关键信息不一致（误报率高，默认关闭）"
    match:
      type: file
      # 由 rules_engine.py 实现模糊匹配逻辑
      fuzzy_match: true
    action: report
