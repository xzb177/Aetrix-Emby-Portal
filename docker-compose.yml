name: aetrix-portal
services:
  aetrix-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: with-scripts
    command:
    - python
    - serve.py
    container_name: aetrix-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
    - .env
    environment:
      ADMIN_DIST: /nonexistent-admin
      AETRIX_ROLE: api
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_TYPE: ${DATABASE_TYPE:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgresql://aetrix:${POSTGRES_PASSWORD:-aetrix_dev_only_change_me}@postgres:5432/aetrix}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-25}
      # WS1: enrich_workers/enrich_batch/db_pool_size 改由管理面板接管（system_configs），此处不再设 env
      EMBY_IMAGE_DIR: /data/images
      EMBY_TRANSCODE_DIR: /data/transcode
      FRONTEND_DIST: /nonexistent-frontend
      MOUNT_RCLONE_BIN: ${MOUNT_RCLONE_BIN:-rclone}
      MOUNT_RCLONE_CONF: /config/rclone/rclone.conf
      NODE_KEY: ea-01
      MOUNT_RCLONE_RC_URL: ${MOUNT_RCLONE_RC_URL:-http://rclone:5572}
      RCLONE_SA_DIR: /sa-accounts
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    expose:
    - '8000'
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 60s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4)
      timeout: 10s
    image: aetrix-backend:latest
    ports:
    - 8000:8000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    volumes:
    - aetrix_data:/data
    # 备份持久化卷：与部署解耦，docker compose up -d --build 不会删除 named volume；重建容器备份不丢
    - ${BACKUP_VOLUME:-aetrix_backups}:/var/backups/aetrix
    - ${MEDIA_ROOT:-./media}:/media:ro
    - ${RCLONE_MOUNT_MP:-/mnt/mp}:/mnt/mp:ro
    - ${RCLONE_MOUNT_PAUL:-/mnt/paul}:/mnt/paul:ro
    - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone
    - ${RCLONE_SA_DIR:-/root/sa-accounts}:/sa-accounts
  aetrix-ea:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: with-scripts
    command:
    - python
    - -m
    - emby_api.main
    container_name: aetrix-ea
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
    - .env
    environment:
      ADMIN_DIST: /nonexistent-admin
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_TYPE: ${DATABASE_TYPE:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgresql://aetrix:${POSTGRES_PASSWORD:-aetrix_dev_only_change_me}@postgres:5432/aetrix}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-25}
      # WS1: enrich_workers/enrich_batch/db_pool_size 改由管理面板接管（system_configs），此处不再设 env
      EMBY_API_PORT: 8001
      EMBY_IMAGE_DIR: /data/images
      EMBY_TRANSCODE_DIR: /data/transcode
      FRONTEND_DIST: /nonexistent-frontend
      MOUNT_RCLONE_BIN: ${MOUNT_RCLONE_BIN:-rclone}
      MOUNT_RCLONE_CONF: /config/rclone/rclone.conf
      MOUNT_RCLONE_RC_URL: ${MOUNT_RCLONE_RC_URL:-http://rclone:5572}
      RCLONE_SA_DIR: /sa-accounts
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      NODE_KEY: ea-01
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    expose:
    - '8001'
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 60s
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health',timeout=4)
      timeout: 10s
    image: aetrix-backend:latest
    ports:
    - 127.0.0.1:${EA_INTERNAL_PORT:-8002}:8001
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    volumes:
    - aetrix_data:/data
    - ${MEDIA_ROOT:-./media}:/media:ro
    - ${RCLONE_MOUNT_MP:-/mnt/mp}:/mnt/mp:ro
    - ${RCLONE_MOUNT_PAUL:-/mnt/paul}:/mnt/paul:ro
    - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone
    - ${RCLONE_SA_DIR:-/root/sa-accounts}:/sa-accounts
  aetrix-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: with-scripts
    command:
    - python
    - -m
    - backend.worker
    container_name: aetrix-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
    - .env
    environment:
      ADMIN_DIST: /nonexistent-admin
      AETRIX_ROLE: worker
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_TYPE: ${DATABASE_TYPE:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgresql://aetrix:${POSTGRES_PASSWORD:-aetrix_dev_only_change_me}@postgres:5432/aetrix}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-25}
      # WS1: enrich_workers/enrich_batch/db_pool_size 改由管理面板接管（system_configs），此处不再设 env
      EMBY_IMAGE_DIR: /data/images
      EMBY_TRANSCODE_DIR: /data/transcode
      FRONTEND_DIST: /nonexistent-frontend
      MOUNT_RCLONE_BIN: ${MOUNT_RCLONE_BIN:-rclone}
      MOUNT_RCLONE_CONF: /config/rclone/rclone.conf
      # 后端只读 MOUNT_RCLONE_RC_URL（裸 RCLONE_RC_URL 无人读取，不要加回）
      MOUNT_RCLONE_RC_URL: ${MOUNT_RCLONE_RC_URL:-http://rclone:5572}
      RCLONE_SA_DIR: /sa-accounts
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCAN_FORCE_REMOTE: 1
      SCAN_WORKERS: 16
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 90s
      test:
      - CMD
      - python
      - -c
      - import redis,os,json,time; r=redis.from_url(os.getenv('REDIS_URL','redis://redis:6379/0'),decode_responses=True);
        h=r.get('aetrix:worker:heartbeat'); assert h and (time.time()-json.loads(h)['updated_at'])<90
      timeout: 10s
    image: aetrix-backend:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    volumes:
    - aetrix_data:/data
    # 备份持久化卷：与部署解耦，docker compose up -d --build 不会删除 named volume；重建容器备份不丢
    - ${BACKUP_VOLUME:-aetrix_backups}:/var/backups/aetrix
    - ${MEDIA_ROOT:-./media}:/media:ro
    - ${RCLONE_MOUNT_MP:-/mnt/mp}:/mnt/mp:ro
    - ${RCLONE_MOUNT_PAUL:-/mnt/paul}:/mnt/paul:ro
    - ${RCLONE_CONFIG_DIR:-./rclone}:/config/rclone
    - ${RCLONE_SA_DIR:-/root/sa-accounts}:/sa-accounts
  postgres:
    container_name: aetrix-postgres
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB:-aetrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetrix_dev_only_change_me}
      POSTGRES_USER: ${POSTGRES_USER:-aetrix}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER:-aetrix} -d $${POSTGRES_DB:-aetrix}
      timeout: 5s
    image: postgres:16-alpine
    command: postgres -c max_connections=200 -c shared_buffers=${PG_SHARED_BUFFERS:-1GB} -c shared_preload_libraries=pg_stat_statements -c work_mem=${PG_WORK_MEM:-16MB}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    volumes:
    - postgres_data:/var/lib/postgresql/data
  redis:
    command:
    - redis-server
    - --appendonly
    - 'yes'
    container_name: aetrix-redis
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 3s
    image: redis:7-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    volumes:
    - redis_data:/data
volumes:
  # aetrix_backups：数据库备份持久化卷。永远不要 docker compose down -v（会删掉所有 named volume 含备份）
  # 如果改了 PG_BACKUP_DIR 环境变量，挂载目标路径要同步改（默认 /var/backups/aetrix 不用动）
  aetrix_data: null
  postgres_data: null
  redis_data: null
  aetrix_backups: null
