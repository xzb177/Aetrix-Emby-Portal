<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/vite.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0a09">
    <meta name="color-scheme" content="dark">
    <!-- 标题衬线字：与用户端一致，不外链 Google Fonts。
         系统宋体（Songti SC / STSong / serif）由 --au-font-serif 承担，首屏不被外部字体卡住。 -->
    <title>Aetrix Admin</title>
    <style>
      /*
       * 应用根节点只负责占满视口。
       * 这里不要写 display:flex + 居中：
       * 1. 根节点是 flex 容器时，下面的 ::before 会变成与界面并排的一个 flex 项，
       *    首屏加载提示会一直挂在界面上（.loading 类不会自己消失）；
       * 2. justify-content: center 会把超宽内容（宽表格）向两侧顶，左边直接不可见。
       * 背景保持透明，让 body 上的极光渐变透上来。
       */
      #app {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* 首屏加载提示：固定定位盖满全屏，JS 挂载完成后由 main.ts 去掉 .loading 类 */
      #app.loading::before {
        content: '加载中...';
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c0a09;
        color: rgba(243, 237, 228, 0.6);
        font-size: 13px;
        letter-spacing: 0.08em;
      }

      /* 白日模式：预套用脚本已写好 data-theme=light，加载提示同步换浅色，
         不然浅色用户首屏会先闪一下暖黑底 */
      html[data-theme='light'] #app.loading::before {
        background: #f5f1ea;
        color: rgba(28, 25, 21, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="app" class="loading"></div>
    <script>
      /*
       * 主题预套用（v2.42.4，2026-10-11 改默认深色）：在样式表与 Vue 挂载前把 html[data-theme] 定好，
       * 白日模式不会先闪一下暖黑底（FOUC）。口径与 src/composables/useTheme.ts
       * 一致：localStorage('aetrix-theme') = 'light' | 'dark' | 'system' | 缺省（深色）。
       * 缺省深色（用户决策 2026-10-11，与用户端一致）：新管理员首次进站默认深色；
       * 显式存了 'system' 的老用户仍跟随系统。
       */
      (function () {
        try {
          var stored = localStorage.getItem('aetrix-theme');
          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (stored === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          } else {
            theme = 'dark';
          }
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f5f1ea');
          }
        } catch (e) { /* localStorage 不可用时跟默认深色 */ }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
